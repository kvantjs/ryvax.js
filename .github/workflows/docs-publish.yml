name: Publish Scalar documentation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate Scalar configuration
        run: npx --yes @scalar/cli@1.3.2 project check-config ./scalar.config.json
      - name: Publish documentation
        env:
          SCALAR_API_KEY: ${{ secrets.SCALAR_API_KEY }}
          PROJECT_SLUG: ${{ vars.SCALAR_PROJECT_SLUG || 'ryvax-docs' }}
        run: |
          test -n "$SCALAR_API_KEY" || { echo 'Missing GitHub secret SCALAR_API_KEY'; exit 1; }
          npx --yes @scalar/cli@1.3.2 auth login --token "$SCALAR_API_KEY"
          npx --yes @scalar/cli@1.3.2 project publish --slug "$PROJECT_SLUG" --config ./scalar.config.json
